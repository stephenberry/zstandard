  <line x1="66" y1="203.1" x2="406" y2="203.1" class="grid"/>
  <text x="58" y="207.1" class="ytick">-15%</text>
  <line x1="66" y1="233.4" x2="406" y2="233.4" class="grid"/>
  <text x="58" y="237.4" class="ytick">-20%</text>
  <line x1="66" y1="263.7" x2="406" y2="263.7" class="grid"/>
  <text x="58" y="267.7" class="ytick">-25%</text>
