  <path d="M534.0,166.5 L550.2,163.9 L566.4,162.0 L582.6,164.8 L598.8,165.3 L615.0,157.6 L631.1,160.9 L647.3,162.6 L663.5,164.9 L679.7,169.7 L695.9,168.7 L712.1,167.2 L728.3,166.6 L744.5,166.8 L760.7,164.1 L776.9,181.7 L793.0,181.3 L809.2,185.2 L825.4,185.4 L841.6,185.7 L857.8,185.8 L874.0,184.8" class="lineB"/>
