<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 112" width="344" height="112" role="img" aria-label="zstandard — a pure Rust Zstandard codec">
  <title>zstandard — a pure Rust Zstandard codec</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <style>
      .wm   { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 44px; font-weight: 700; letter-spacing: -1px; }
      .tag  { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 3.2px; fill: #6e7781; }
      .z    { fill: #4f46e5; }
      .rest { fill: #0891b2; }
      @media (prefers-color-scheme: dark) {
        .tag  { fill: #8b949e; }
        .z    { fill: #818cf8; }
        .rest { fill: #22d3ee; }
      }
    </style>
  </defs>

  <rect x="8" y="16" width="80" height="80" rx="22" fill="url(#tile)"/>
  <g fill="#ffffff">
    <rect x="25" y="32"  width="46" height="8" rx="4" opacity="0.95"/>
    <rect x="29" y="46"  width="38" height="8" rx="4" opacity="0.82"/>
    <rect x="33" y="60"  width="30" height="8" rx="4" opacity="0.69"/>
    <rect x="37" y="74"  width="22" height="8" rx="4" opacity="0.56"/>
  </g>

  <text x="106" y="58" class="wm"><tspan class="z">z</tspan><tspan class="rest">standard</tspan></text>
  <text x="108" y="86" class="tag">PURE RUST CODEC</text>
</svg>
