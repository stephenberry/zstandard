# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/ for
# the full schema reference.

[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = []

[licenses]
version = 2
# Permissive licenses only, matching what this crate is itself released under
# plus the ones found in our transitive dev/build dependencies. A copyleft
# dependency would be incompatible with `MIT OR Apache-2.0` and must fail this
# check rather than be waved through: `GPL-2.0` was allowed here only while the
# crate was itself GPL-2.0 dual, and is deliberately not in this list.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
