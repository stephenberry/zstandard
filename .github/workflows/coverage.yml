name: Coverage

# Which lines the suite never reaches — the decode error branches above all,
# where a line nothing exercises is a latent defect rather than dead weight.
# Codecov gets an LCOV report. Nothing here gates a merge: there are no
# thresholds, `fail_ci_if_error` is off, and `main` is not protected.
#
# It runs weekly rather than on every push, for the reason `miri.yml` gives for
# doing the same. A pass takes around fifteen minutes against CI's nine, which
# is too long to sit in front of every change in exchange for a number nothing
# acts on, and firing on both `push` and `pull_request` measured every merged
# branch twice over. This is a sweep for what the suite has stopped reaching,
# not a verdict on one commit.
#
# Run it directly on anything that adds a code path — `gh workflow run
# coverage.yml`, or the Actions tab.

on:
  schedule:
    # 04:00 UTC on Saturdays, clear of the daily fuzz run at 06:00 and of the
    # weekly Miri sweep at the same hour on Sunday.
    - cron: "0 4 * * 6"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  llvm-cov:
    name: cargo llvm-cov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Upstream is deliberately absent here, which makes the interop suite
      # skip itself. `ZSTANDARD_UPSTREAM_DIR` naming a path that does not exist
      # is what reaches the skip branch: an empty value reads as unset, and the
      # harness then finds the in-tree checkout and runs anyway. Leaving
      # `ZSTANDARD_REQUIRE_UPSTREAM` unset matters for the same reason -- set,
      # it turns the missing checkout into a hard failure.
      #
      # The interop suite is a conformance instrument, not a coverage one: it
      # proves byte-exact agreement with the C library in both directions. That
      # value is untouched here, because the same 68 tests run in all four `CI`
      # test legs on every push. What it costs *this* workflow was measured
      # rather than assumed: running it takes the job from ~8 to ~28 minutes
      # locally — on the runners the skipping job lands nearer fifteen — and
      # buys 179 lines of library coverage, or 1.1 points
      # (81.5% against 80.4%). The apparent 23-point drop in the file-level
      # total is the suite and its harness measuring themselves -- 7,041 lines
      # of `src/support/upstream_zstd.rs` exist only to drive the C library and
      # go uncovered by construction when it skips.
      - name: Run coverage
        run: |
          cargo llvm-cov --all-features --lcov --output-path lcov.info \
            --ignore-filename-regex '(src/bin/|benches/|tests/upstream_interop\.rs)'
        env:
          ZSTANDARD_UPSTREAM_DIR: ${{ github.workspace }}/no-upstream-checkout

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
