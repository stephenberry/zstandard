name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to dry-run (e.g. v0.1.0)"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: derive
        name: Derive version
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          version="${tag#v}"
          cargo_version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::tag $tag (=$version) does not match Cargo.toml version $cargo_version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish-dry-run:
    name: cargo publish --dry-run
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --dry-run --verbose

  release-notes:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [verify, publish-dry-run]
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract changelog section
        id: changelog
        shell: bash
        run: |
          version="${{ needs.verify.outputs.version }}"
          # Pull lines between "## [<version>]" and the next "## [".
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-body.md
          if ! [ -s release-body.md ]; then
            echo "Release $version" > release-body.md
          fi

      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-body.md
          draft: true
          prerelease: ${{ contains(needs.verify.outputs.version, '-') }}
